services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supercampus
      POSTGRES_USER: supercampus
      POSTGRES_PASSWORD: supercampus
    ports:
      - "5432:5432"
    volumes:
      - supercampus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supercampus -d supercampus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supercampus_pgdata:
